<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miler</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">Miler</div>
      <div id="user-chip" class="user-chip hidden"></div>
    </header>

    <!-- ── Home ──────────────────────────────────────────────── -->
    <section id="home-view" class="view hidden">

      <div class="action-cards">
        <button class="action-card card-orange" onclick="goCreate()">
          <div class="action-icon">⚔️</div>
          <div class="action-text">
            <div class="action-label">Start a Challenge</div>
            <div class="action-desc">Create a rivalry and invite a friend</div>
          </div>
        </button>
        <button class="action-card card-blue" onclick="showJoinPanel()">
          <div class="action-icon">🔗</div>
          <div class="action-text">
            <div class="action-label">Join a Challenge</div>
            <div class="action-desc">Enter a code from a friend</div>
          </div>
        </button>
      </div>

      <div id="join-panel" class="join-panel hidden">
        <input id="join-code" class="code-input" placeholder="Enter 6-character code" maxlength="6" />
        <button class="btn btn-blue" onclick="joinChallenge()">Join</button>
      </div>

      <div id="my-challenges-section" class="hidden">
        <div class="section-title">Your Challenges</div>
        <div id="challenges-list" class="challenges-list"></div>
      </div>

      <div id="connect-prompt" class="connect-prompt hidden">
        <p>Connect your Strava to get started</p>
        <a href="/auth/login" class="btn btn-strava">Connect with Strava</a>
      </div>
    </section>

    <!-- ── Create ─────────────────────────────────────────────── -->
    <section id="create-view" class="view hidden">
      <button class="back-btn" onclick="goHome()">← Back</button>
      <div class="page-title">New Challenge</div>

      <div class="form-block">
        <div class="field-label">Name</div>
        <input id="create-name" class="text-input" placeholder="e.g. June Grind" maxlength="32" />
      </div>

      <div class="form-block">
        <div class="field-label">Duration</div>
        <div class="dur-grid">
          <button class="dur-btn" data-type="days" data-days="7">1 week</button>
          <button class="dur-btn" data-type="days" data-days="14">2 weeks</button>
          <button class="dur-btn selected" data-type="days" data-days="30">1 month</button>
          <button class="dur-btn" data-type="days" data-days="90">3 months</button>
          <button class="dur-btn dur-month" data-type="month" id="this-month-btn"></button>
          <button class="dur-btn" data-type="custom">Custom</button>
        </div>

        <div id="custom-dates" class="custom-dates hidden">
          <div class="date-row">
            <div>
              <div class="field-label-sm">Start date</div>
              <input type="date" id="custom-start" class="date-input" />
            </div>
            <div>
              <div class="field-label-sm">End date</div>
              <input type="date" id="custom-end" class="date-input" />
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-strava btn-full" onclick="submitCreate()">Create & Get Code</button>
    </section>

    <!-- ── Waiting ────────────────────────────────────────────── -->
    <section id="waiting-view" class="view hidden">
      <button class="back-btn" onclick="goHome()">← Back</button>
      <div class="waiting-card">
        <div class="waiting-icon">⏳</div>
        <h2 id="waiting-title">Challenge created!</h2>
        <p class="waiting-meta" id="waiting-meta"></p>
        <p class="waiting-hint">Share this code with your friend:</p>
        <div class="big-code" id="waiting-code"></div>
        <p class="or-text">or share the link</p>
        <div class="share-url">
          <span id="share-url-text"></span>
          <button class="copy-btn" onclick="copyUrl()">Copy</button>
        </div>
      </div>
    </section>

    <!-- ── Rivalry ────────────────────────────────────────────── -->
    <section id="rivalry-view" class="view hidden">
      <button class="back-btn" onclick="goHome()">← Back</button>

      <div class="rivalry-header">
        <div class="rivalry-name" id="rivalry-name"></div>
        <div class="rivalry-meta">
          <span id="rivalry-dates"></span>
          <span class="meta-dot">·</span>
          <span id="rivalry-timeleft"></span>
        </div>
      </div>

      <!-- Horizontal bar chart -->
      <div class="chart-section">
        <div class="chart-label">Miles</div>
        <div class="h-bar-row">
          <div class="h-name" id="hname1"></div>
          <div class="h-track">
            <div class="h-fill h-orange" id="hfill1"></div>
          </div>
          <div class="h-val" id="hval1"></div>
        </div>
        <div class="h-bar-row">
          <div class="h-name" id="hname2"></div>
          <div class="h-track">
            <div class="h-fill h-blue" id="hfill2"></div>
          </div>
          <div class="h-val" id="hval2"></div>
        </div>
      </div>

      <div class="lead-message" id="lead-message"></div>

      <div class="stat-grid" id="stat-grid"></div>

      <div class="actions">
        <button class="btn btn-secondary" onclick="refreshChallenge()">↻ Refresh</button>
      </div>
    </section>

    <div id="error-banner" class="error-banner hidden"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
